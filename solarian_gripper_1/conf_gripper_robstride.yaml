# Default configuration for Gripper1RobstrideModule (parallel gripper, one Robstride L7).
#
# Copied into a project's conf/ directory by `solarian add-module`. Commands are
# given as finger aperture in mm; the module converts to the servo's normalized
# space, and each backend maps that to the physical target (real: yaml
# real_range_*; sim: sim_joint / sim_range_* below).

# Serial port / device address the servo bus connects to.
port: /dev/ttyUSB0

# Control loop frequency (Hz).
frequency: 30
interpolator_type: scalar
max_speed: 80.0

# Physical finger aperture (fingertip separation) at the ends of travel.
# Same finger travel as the Feetech variant: 85 mm fully open.
aperture_closed_mm: -10.0
aperture_open_mm: 85.0

actuators:
    gripper:
        id: 7
        port: ${port}
        mode: range_m100_100
        # Only this joint is actuated; onshape-to-robot's <equality>
        # (ratio -1) drives the opposite finger. Prefix must match the
        # ModuleAttachment prefix in the robot's scene.
        sim_joint: "gripper/left_manifold_to_rail"
        sim_range_min: 0 # joint fully open  (fingers apart)
        sim_range_max: 0.0545 # joint fully closed (fingers together)
        # Flip so normalized -100 -> closed (range_max), 100 -> open (range_min),
        # matching aperture_closed_mm / aperture_open_mm.
        sim_drive_mode: 1
